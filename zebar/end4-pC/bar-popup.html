<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>end4-pC bar popup</title>
  <link rel="stylesheet" href="./lib/base.css" />
  <style>
    /* end4's bar hover popups (clock, resources, weather, battery...). One window shared by every
       bar: it waits off-screen and the hovered bar tells it what to show and where. */
    html, body { overflow: hidden; background: transparent; }
    #pop { display: inline-block; margin: 6px; min-width: 220px; max-width: 320px; padding: 12px 14px; border-radius: var(--round-lg);
      background: var(--layer0); border: 1px solid color-mix(in srgb, var(--outline-variant) 45%, transparent); box-shadow: var(--shadow); font-size: 13px; }
    #pop h4 { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; font-size: 13px; font-weight: 500; }
    #pop h4 .ms { font-size: 18px; color: var(--primary); }
    #pop .kv { display: flex; justify-content: space-between; gap: 16px; padding: 3px 0; }
    #pop .kv span:first-child { display: flex; align-items: center; gap: 6px; color: var(--on-surface-variant); }
    #pop .kv .ms { font-size: 16px; }
    #pop .big { font-size: 26px; font-weight: 500; }
    #pop .cal { display: grid; grid-template-columns: repeat(7, 28px); text-align: center; font-size: 12px; margin-top: 6px; }
    #pop .cal span { height: 26px; display: grid; place-items: center; border-radius: 50%; }
    #pop .cal .dow { color: var(--on-surface-variant); font-size: 11px; }
    #pop .cal .out { opacity: 0.35; }
    #pop .cal .today { background: var(--primary); color: var(--on-primary); font-weight: 600; }
  </style>
</head>
<body>
  <div id="pop"></div>
  <script type="module">
    import { zebar, $, watchTheme, bridge } from './lib/core.js';
    const tauri = zebar.currentWidget().window.tauri;
    const away = () => tauri.setPosition({ type: 'Physical', x: -32000, y: -32000 }).catch(() => {});
    await away();
    tauri.setIgnoreCursorEvents(true).catch(() => bridge('click-through', 'bar-popup'));   // never blocks the bar
    await watchTheme();
    let shown = '';
    new BroadcastChannel('end4-bar-popup').onmessage = async ({ data: m }) => {
      if (!m.show) { if (m.id === shown) { shown = ''; away(); } return; }
      $('#pop').innerHTML = m.html;
      const r = $('#pop').getBoundingClientRect(), dpr = devicePixelRatio;
      const w = Math.ceil(r.width + 12), h = Math.ceil(r.height + 12);
      await tauri.setSize({ type: 'Logical', width: w, height: h }).catch(() => {});
      if (shown !== m.id) await tauri.setPosition({ type: 'Physical', x: Math.round(Math.max(m.minX, m.x - (w * dpr) / 2)), y: Math.round(m.y) }).catch(() => {});
      shown = m.id;
    };
  </script>
</body>
</html>
