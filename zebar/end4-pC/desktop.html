<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>end4-pC desktop widgets</title>
  <link rel="stylesheet" href="./lib/base.css" />
  <style>
    /* Column of end4 desktop widgets, pinned to the desktop (bottom-most). */
    /* One card per window (desktop.js sizes the window to #col and moves it when dragged). */
    html, body { overflow: hidden; background: transparent; }
    #col { display: flex; flex-direction: column; width: 310px; padding: 4px; cursor: grab; user-select: none; }
    #col:active { cursor: grabbing; }
    #col textarea { cursor: text; user-select: text; }
    .w { background: color-mix(in srgb, var(--surface-container-low) 88%, transparent); border-radius: var(--round-lg); overflow: hidden; }

    /* cookie clock */
    #clock { background: none; display: grid; place-items: center; height: 250px; }
    #clock svg { overflow: visible; filter: drop-shadow(0 4px 12px color-mix(in srgb, #000 30%, transparent)); }
    .cookie { fill: color-mix(in srgb, var(--secondary-container) 92%, transparent); }
    .dial { fill: var(--on-secondary-container); opacity: 0.22; font-family: var(--font); font-weight: 700; font-size: 62px; text-anchor: middle; dominant-baseline: central; }
    .hand-h { stroke: var(--on-secondary-container); stroke-width: 13; stroke-linecap: round; }
    .hand-m { stroke: var(--on-secondary-container); stroke-width: 8; stroke-linecap: round; }
    .hand-s { stroke: var(--primary); stroke-width: 3; stroke-linecap: round; }
    .pin { fill: var(--on-secondary-container); }
    .badge-bg { fill: var(--primary-container); }
    .badge-tx { fill: var(--on-primary-container); font-family: var(--font); font-weight: 600; font-size: 22px; text-anchor: middle; dominant-baseline: central; }

    /* weather */
    #weather { display: flex; height: 92px; }
    #weather .big { width: 92px; display: grid; place-items: center; align-content: center; gap: 2px; background: var(--primary-container); color: var(--on-primary-container); }
    #weather .big .ms { font-size: 34px; }
    #weather .big b { font-size: 18px; font-weight: 500; }
    #weather .info { padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; }
    #weather .info b { font-weight: 500; font-size: 15px; }
    #weather .info small { font-size: 12px; color: var(--on-surface-variant); text-transform: lowercase; }
    #weather .info .wind { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--on-surface-variant); margin-top: 4px; }
    #weather .info .wind .ms { font-size: 14px; }

    /* week calendar */
    #week { padding: 12px 12px 10px; }
    #week .chip { height: 26px; padding: 0 12px; background: var(--secondary-container); color: var(--on-secondary-container); font-weight: 500; font-size: 12.5px; }
    #week .row { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; margin-top: 8px; }
    #week .row span { height: 26px; display: grid; place-items: center; }
    #week .dow { color: var(--on-surface-variant); font-size: 11px; }
    #week .today { background: var(--primary); color: var(--on-primary); border-radius: 50%; width: 26px; margin: 0 auto; font-weight: 600; }

    /* greeting */
    #greet { display: flex; align-items: center; gap: 12px; padding: 10px; }
    #greet .av { width: 70px; height: 70px; border-radius: var(--round-md); display: grid; place-items: center; background: var(--tertiary-container); color: var(--on-tertiary-container); font-size: 30px; font-weight: 600; flex: none; }
    #greet b { display: block; font-size: 15px; font-weight: 600; }
    #greet span { display: block; font-size: 13px; }
    #greet small { font-size: 11px; color: var(--on-surface-variant); }

    /* media */
    #media { display: flex; height: 92px; }
    #media:empty { display: none; }
    #media .cover { width: 92px; flex: none; background: linear-gradient(135deg, var(--primary-container), var(--tertiary-container)); display: grid; place-items: center; position: relative; }
    #media .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #media .cover .ms { font-size: 34px; color: var(--on-primary-container); opacity: 0.6; }
    #media .body { flex: 1; min-width: 0; padding: 10px 12px; display: flex; flex-direction: column; }
    #media .body b { font-weight: 500; font-size: 14px; }
    #media .body small { font-size: 11.5px; color: var(--on-surface-variant); }
    #media .ctl { margin-top: auto; display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
    #media .ctl button { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
    #media .ctl button:hover { background: var(--hover); }
    #media .ctl button.pp { width: 38px; height: 38px; background: var(--primary); color: var(--on-primary); border-radius: var(--round-sm); }
    #media .ctl .ms { font-size: 18px; }

    /* clock styles: digital, analog, pixel (cookie is above) */
    .digital { text-align: center; color: var(--on-surface); text-shadow: 0 2px 12px color-mix(in srgb, #000 35%, transparent); }
    .digital b { display: block; font-size: 84px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -2px; }
    .digital span { font-size: 16px; font-weight: 500; }
    #clock.short { height: 150px; }
    .face { fill: color-mix(in srgb, var(--surface-container) 90%, transparent); }
    .tick { stroke: var(--on-surface-variant); stroke-linecap: round; }
    .px-on { fill: var(--primary); }
    .px-off { fill: var(--on-surface); opacity: 0.08; }

    /* small cards: calendar, to-do, notes, timer, world clock, resources, text */
    .pad { padding: 12px 14px; }
    .w h3 { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--on-surface-variant); margin: 0 0 8px; }
    .w h3 .ms { font-size: 16px; }
    #calendar .grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; row-gap: 2px; }
    #calendar .grid span { height: 26px; width: 26px; margin: 0 auto; display: grid; place-items: center; border-radius: 50%; }
    #calendar .dow { color: var(--on-surface-variant); font-size: 11px; }
    #calendar .out { opacity: 0.35; }
    #calendar .today { background: var(--primary); color: var(--on-primary); font-weight: 600; }
    #todo .item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; cursor: pointer; }
    #todo .item .ms { font-size: 18px; color: var(--primary); }
    #todo .item.done span:last-child { text-decoration: line-through; color: var(--on-surface-variant); }
    #notes textarea { width: 100%; min-height: 110px; resize: vertical; border: 0; outline: none; background: none; color: var(--on-surface); font: 13px/1.45 var(--font); }
    #timer .row { display: flex; align-items: center; gap: 12px; }
    #timer .row b { flex: 1; font-size: 34px; font-weight: 500; font-variant-numeric: tabular-nums; }
    #timer small { color: var(--on-surface-variant); font-size: 12px; }
    #timer button { width: 44px; height: 44px; border-radius: var(--round-md); display: grid; place-items: center; background: var(--primary); color: var(--on-primary); }
    #worldclock .tz { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; }
    #worldclock .tz span { flex: 1; font-size: 13px; }
    #worldclock .tz small { font-size: 11px; color: var(--on-surface-variant); }
    #worldclock .tz b { font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
    #resources .rings { display: flex; justify-content: space-around; }
    #resources .r { display: grid; justify-items: center; gap: 4px; font-size: 12px; }
    #resources .ring-wrap { position: relative; width: 56px; height: 56px; }
    #resources .ring-wrap b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 500; }
    #text { font-size: 20px; font-weight: 500; white-space: pre-wrap; overflow-wrap: anywhere; }

    /* lyrics cards (end4's media widget with lyrics): "lyrics" = card, "cover" = blurred cover */
    body[data-card="lyrics"] #col, body[data-card="cover"] #col { width: 428px; }
    .lyr { position: relative; overflow: hidden; text-align: center;
      -webkit-mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent); }
    .lyr .inner { position: absolute; left: 0; right: 0; transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1); will-change: transform; }
    .lyr .l { padding: 3px 10px; font-size: 13px; opacity: 0.45; transition: opacity 0.4s ease, transform 0.4s ease; }
    .lyr .l.cur { opacity: 1; transform: scale(1.18); font-weight: 500; }
    .lyr .none { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0.6; font-size: 13px; }
    .np-none { display: flex; align-items: center; gap: 10px; padding: 16px; color: var(--on-surface-variant); font-size: 13px; }
    .ctl-row { display: flex; align-items: center; gap: 6px; }
    .ctl-row button { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
    .ctl-row button:hover { background: var(--hover); }
    .ctl-row .play { width: 46px; height: 46px; background: var(--primary); color: var(--on-primary); }
    .ctl-row .play:hover { background: var(--primary); filter: brightness(1.08); }

    #lyrics { background: color-mix(in srgb, var(--primary-container) 80%, transparent); color: var(--on-primary-container); }
    #lyrics .top { display: flex; gap: 14px; }
    #lyrics .art { width: 120px; height: 120px; flex: none; background: var(--secondary-container); display: grid; place-items: center; }
    #lyrics .art img { width: 100%; height: 100%; object-fit: cover; }
    #lyrics .meta { flex: 1; min-width: 0; padding: 14px 14px 10px 0; display: flex; flex-direction: column; }
    #lyrics .meta b { font-size: 16px; font-weight: 500; }
    #lyrics .meta small { font-size: 13.5px; opacity: 0.8; }
    #lyrics .ctl-row { margin-top: auto; justify-content: flex-end; }
    #lyrics .lyr { height: 230px; margin-top: 4px; }
    #lyrics .lyr .l.cur { font-size: 14.5px; }

    #cover { position: relative; color: #fff; background: #222; }
    #cover .bg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(28px) saturate(1.3); opacity: 0.85; }
    #cover .bg::after { content: ''; position: absolute; inset: 0; background: color-mix(in srgb, var(--surface) 35%, transparent); }
    #cover .body { position: relative; padding: 14px; text-shadow: 0 1px 6px rgba(0,0,0,0.45); }
    #cover .row { display: flex; gap: 14px; }
    #cover .art { width: 150px; height: 150px; flex: none; border-radius: var(--round-md); overflow: hidden; background: rgba(255,255,255,0.12); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,0.35); }
    #cover .art img { width: 100%; height: 100%; object-fit: cover; }
    #cover .lyr { flex: 1; height: 150px; text-align: left; }
    #cover .lyr .l { padding: 3px 18% 3px 0; transform-origin: left center; }   /* room for the 1.18x current line */
    #cover .t { margin-top: 12px; font-size: 16px; font-weight: 500; }
    #cover small { font-size: 12.5px; opacity: 0.85; }
    #cover .mid { display: flex; align-items: center; justify-content: space-between; }
    #cover .time { font-size: 13px; opacity: 0.9; font-variant-numeric: tabular-nums; }
    #cover .ctl-row .play { background: rgba(255,255,255,0.85); color: #222; border-radius: var(--round-md); }
    #cover .seekrow { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
    #cover .seek { flex: 1; height: 22px; cursor: pointer; color: #fff; }
    #cover .seek svg { display: block; width: 100%; height: 22px; overflow: visible; }
    #cover .ctl-row button:hover { background: rgba(255,255,255,0.15); }
    #cover .volrow { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    #cover .volrow button { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; }
    #cover .volrow button:hover { background: rgba(255,255,255,0.15); }
    #cover .volrow .ms { font-size: 18px; }
    #cover .volval { width: 38px; text-align: right; font-size: 12px; opacity: 0.85; font-variant-numeric: tabular-nums; }
    #cover .vol { flex: 1; height: 18px; margin: 0; -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
    #cover .vol::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, #fff var(--v, 0%), rgba(255,255,255,0.3) var(--v, 0%)); }
    #cover .vol::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }

    /* image cards: no card background, just the shaped picture (with a shadow that follows the shape) */
    body[data-card^="image"] #col { padding: 14px; }
    body[data-card^="image"] .w { background: none; overflow: visible; }
    body[data-card^="image"] .np-none { background: color-mix(in srgb, var(--surface-container-low) 88%, transparent); border-radius: var(--round-lg); }
    .shape-wrap { filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.4)); }
    .shape { display: block; object-fit: cover; }
  </style>
</head>
<body>
  <!-- Cards are added by desktop.js in the order of config.json desktop.widgets. -->
  <div id="col"></div>
  <script type="module" src="./desktop.js"></script>
</body>
</html>
