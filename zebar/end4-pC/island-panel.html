<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>end4-pC island panel</title>
  <link rel="stylesheet" href="./lib/base.css" />
  <style>
    /* The Dynamic Island, expanded: opens under the island when it's clicked. The window follows
       the panel's size; Esc, a click elsewhere or another click on the island closes it. */
    html, body { overflow: hidden; background: transparent; }
    #panel { width: 400px; margin: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px;
      background: var(--layer0); border: 1px solid color-mix(in srgb, var(--outline-variant) 45%, transparent);
      border-radius: 28px; box-shadow: var(--shadow); transform-origin: top center; animation: grow 0.38s cubic-bezier(0.34, 1.3, 0.64, 1); }
    @keyframes grow { from { transform: scale(0.55, 0.3); opacity: 0; } }
    body.leaving #panel { transform: scale(0.8, 0.5); opacity: 0; transition: all 0.15s ease-in; }
    section { display: flex; flex-direction: column; gap: 10px; }
    section + section { padding-top: 12px; border-top: 1px solid color-mix(in srgb, var(--outline-variant) 40%, transparent); }
    h4 { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 12px; font-weight: 500; color: var(--on-surface-variant); }
    h4 .ms { font-size: 16px; }

    .np { display: flex; gap: 14px; align-items: center; }
    .np .art { width: 92px; height: 92px; flex: none; border-radius: 20px; overflow: hidden; background: var(--secondary-container); display: grid; place-items: center; }
    .np .art img { width: 100%; height: 100%; object-fit: cover; }
    .np .art .ms { font-size: 36px; color: var(--on-secondary-container); }
    .np .meta { min-width: 0; flex: 1; }
    .np .meta b { display: block; font-size: 17px; font-weight: 500; }
    .np .meta span { display: block; font-size: 13px; color: var(--on-surface-variant); }
    .seekrow { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; }
    .seek { flex: 1; height: 22px; cursor: pointer; color: var(--primary); }
    .ctl { display: flex; justify-content: center; align-items: center; gap: 10px; }
    .ctl button { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
    .ctl button:hover { background: var(--hover); }
    .ctl .ms { font-size: 26px; }
    .ctl .big { width: 60px; height: 60px; border-radius: 20px; background: var(--primary); color: var(--on-primary); }
    .ctl .big:hover { background: var(--primary); filter: brightness(1.08); }
    .ctl .big .ms { font-size: 30px; }
    .lyr { position: relative; height: 70px; overflow: hidden; text-align: center; color: var(--on-surface-variant);
      -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); }
    .lyr .inner { position: absolute; left: 0; right: 0; transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
    .lyr .l { padding: 2px 8px; font-size: 13px; opacity: 0.5; transition: opacity 0.4s, transform 0.4s; }
    .lyr .l.cur { opacity: 1; color: var(--on-surface); transform: scale(1.12); font-weight: 500; }
    .lyr .none { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12.5px; }

    .bigtime { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .bigtime b { font-size: 44px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1; }
    .bigtime span { font-size: 13px; color: var(--on-surface-variant); }
    .row { display: flex; gap: 8px; }
    .row .chip { cursor: pointer; }
    .rec b { color: var(--error); }
    .dot { display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 50%; background: var(--error); animation: pulse 0.9s ease-in-out infinite alternate; }
    @keyframes pulse { to { opacity: 0.25; } }

    section.idle { flex-direction: row; align-items: center; justify-content: space-between; }
    .idle .when b { display: block; font-size: 44px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
    .idle .when span { font-size: 13px; color: var(--on-surface-variant); }
    .idle .wx { text-align: right; font-size: 13px; color: var(--on-surface-variant); }
    .idle .wx .ms { font-size: 34px; color: var(--primary); display: block; margin-left: auto; }
    .idle .wx b { font-size: 18px; color: var(--on-surface); font-weight: 500; }

    .notif { display: flex; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--layer1); cursor: pointer; font-size: 13px; }
    .notif:hover { background: var(--layer2); }
    .notif .tx { flex: 1; min-width: 0; }
    .notif .tx b { display: block; font-weight: 500; }
    .notif .tx span { display: block; color: var(--on-surface-variant); }
    .notif time { font-size: 11px; color: var(--on-surface-variant); flex: none; }
    .muted-line { font-size: 12.5px; color: var(--on-surface-variant); }
  </style>
</head>
<body>
  <div id="panel"></div>
  <script type="module" src="./island-panel.js"></script>
</body>
</html>
