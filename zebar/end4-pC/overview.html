<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>end4-pC overview</title>
  <link rel="stylesheet" href="./lib/base.css" />
  <style>
    #panel {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; gap: 14px;
      padding: 18px;
      background: color-mix(in srgb, var(--layer0) 94%, transparent);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 45%, transparent);
      border-radius: var(--round-xl);
      box-shadow: var(--shadow);
      animation: pop-in 0.3s var(--ease);
    }
    .search {
      display: flex; align-items: center; gap: 10px;
      height: 50px; padding: 0 18px; margin: 0 auto; width: min(560px, 100%);
      border-radius: var(--round-full); background: var(--layer2);
    }
    .search input { flex: 1; border: 0; outline: none; background: transparent; font-size: 16px; }
    .search .ms { color: var(--on-surface-variant); }
    .hint { font-size: 12px; color: var(--on-surface-variant); text-align: center; margin-top: -6px; }

    #grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 1fr; gap: 10px; }
    .ws { display: flex; flex-direction: column; min-height: 0; border-radius: var(--round-lg); background: var(--layer1); padding: 10px; border: 2px solid transparent; transition: border-color 0.2s, background 0.2s; }
    .ws.current { border-color: var(--primary); }
    .ws.drop { background: var(--layer3); border-style: dashed; border-color: var(--primary); }
    .ws-head { display: flex; align-items: center; gap: 8px; padding: 2px 4px 8px; font-size: 13px; color: var(--on-surface-variant); cursor: pointer; }
    .ws-head b { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--layer3); color: var(--on-surface); font-weight: 600; font-size: 12px; }
    .ws.current .ws-head b { background: var(--primary); color: var(--on-primary); }
    .wins { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; scrollbar-width: none; }
    .win {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: var(--round-md);
      background: var(--layer2); text-align: left; cursor: pointer;
      transition: background 0.15s, transform 0.25s var(--ease);
    }
    .win:hover, .win.sel { background: var(--secondary-container); color: var(--on-secondary-container); }
    .win.focused { outline: 2px solid var(--primary); outline-offset: -2px; }
    .win .app { width: 32px; height: 32px; border-radius: var(--round-sm); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
    .win .app.s0 { background: var(--primary-container); color: var(--on-primary-container); }
    .win .app.s1 { background: var(--secondary-container); color: var(--on-secondary-container); }
    .win .app.s2 { background: var(--tertiary-container); color: var(--on-tertiary-container); }
    .win .tx { min-width: 0; line-height: 1.25; }
    .win .tx b { display: block; font-weight: 500; font-size: 12.5px; }
    .win .tx span { display: block; font-size: 11.5px; opacity: 0.75; }
    .win .badge { margin-left: auto; font-size: 15px; opacity: 0.7; }
    .win.dragging { opacity: 0.4; }
    .empty-ws { margin: auto; font-size: 12px; color: var(--outline); }
  </style>
</head>
<body>
  <div id="panel">
    <label class="search"><span class="ms">search</span><input id="q" placeholder="Search windows" autocomplete="off" autofocus /></label>
    <div class="hint">Enter to focus · arrows to move · drag a window onto a workspace to move it · Esc to close</div>
    <div id="grid"></div>
  </div>
  <script type="module" src="./overview.js"></script>
</body>
</html>
