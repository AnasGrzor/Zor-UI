<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>zor-ui dock</title>
  <link rel="stylesheet" href="./lib/base.css" />
  <style>
    /* end4's dock: pinned apps + open windows, docked to the bottom edge (Zebar reserves the space). */
    html, body { overflow: hidden; background: transparent; }
    body { display: flex; align-items: flex-end; justify-content: center; height: 100vh; }
    #dock:empty { display: none; }
    #dock { display: flex; gap: 4px; padding: 6px; margin-bottom: 4px; border-radius: var(--round-xl);
      background: var(--layer0); border: 1px solid color-mix(in srgb, var(--outline-variant) 45%, transparent); box-shadow: var(--shadow); }
    .app { position: relative; width: 44px; height: 44px; border-radius: var(--round-md); display: grid; place-items: center; transition: background 0.2s var(--ease-fx); }
    .app:hover { background: var(--hover); }
    .app.focused { background: var(--secondary-container); }
    .app img, .app .letter { grid-area: 1 / 1; width: 30px; height: 30px; }
    .app .letter { border-radius: 50%; display: grid; place-items: center; background: var(--tertiary-container); color: var(--on-tertiary-container); font-weight: 600; }
    .app img + .letter { visibility: hidden; }
    .app.running::after { content: ''; position: absolute; bottom: 2px; width: 6px; height: 3px; border-radius: 2px; background: var(--outline); }
    .app.focused::after { width: 14px; background: var(--primary); }
    .sep { width: 1px; margin: 6px 2px; background: var(--outline-variant); }
  </style>
</head>
<body>
  <div id="dock"></div>
  <script type="module" src="./dock.js"></script>
</body>
</html>
