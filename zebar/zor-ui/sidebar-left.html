<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>zor-ui sidebar left</title>
  <link rel="stylesheet" href="./lib/base.css" />
  <style>
    #panel {
      position: absolute;
      top: 0; left: 6px;
      width: calc(100% - 12px);
      height: calc(100vh - 56px - 6px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      background: var(--layer0);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 45%, transparent);
      border-radius: var(--round-xl);
      box-shadow: var(--shadow);
      animation: slide-in-left 0.35s var(--ease);
    }
    .top { display: flex; gap: 6px; align-items: center; }
    .top .tabbar { flex: 1; }
    .top .tabbar button span.lbl { display: none; }
    .top .tabbar button.sel span.lbl { display: inline; }
    #pin.on { color: var(--primary); background: var(--secondary-container); }
    .tab-page { flex: 1; min-height: 0; display: none; flex-direction: column; gap: 10px; }
    .tab-page.sel { display: flex; animation: pop-in 0.25s var(--ease); }
    .empty { margin: auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 24px; }
    .empty .ms { font-size: 44px; }

    /* AI */
    .ai-head { display: flex; align-items: center; gap: 6px; }
    #ai-model { max-width: 75%; background: var(--secondary-container); color: var(--on-secondary-container); }
    #ai-model .ms { font-size: 18px; }
    .ai-menu { position: absolute; z-index: 5; top: 110px; left: 12px; right: 12px; max-height: 55vh; background: var(--layer3); border-radius: var(--round-lg); padding: 6px; box-shadow: var(--shadow); }
    .ai-menu[hidden] { display: none; }
    .ai-menu-group { font-size: 11.5px; color: var(--on-surface-variant); padding: 10px 12px 4px; text-transform: capitalize; }
    .ai-menu-group .ok { color: var(--primary); } .ai-menu-group .warn { color: var(--error); }
    .ai-menu-item { display: flex; flex-direction: column; align-items: flex-start; width: 100%; padding: 8px 12px; border-radius: var(--round-md); text-align: left; }
    .ai-menu-item small { font-size: 11px; color: var(--on-surface-variant); }
    .ai-menu-item:hover { background: var(--hover); } .ai-menu-item.sel { background: var(--secondary-container); }
    .ai-msgs { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 2px; user-select: text; }
    .ai-empty { margin: auto 0; text-align: center; padding: 10px 14px; }
    .ai-empty .big { font-size: 48px; color: var(--primary); display: block; margin-bottom: 6px; }
    .ai-empty b { font-size: 17px; font-weight: 500; }
    .ai-help { text-align: left; display: grid; gap: 6px; margin-top: 12px; font-size: 12px; }
    .ai-help div { display: grid; gap: 2px; background: var(--layer1); border-radius: var(--round-sm); padding: 8px 10px; }
    .ai-help span { color: var(--on-surface-variant); }
    .msg { max-width: 92%; border-radius: var(--round-lg); padding: 10px 14px; font-size: 13.5px; line-height: 1.5; overflow-wrap: anywhere; }
    .msg.user { align-self: flex-end; background: var(--secondary-container); color: var(--on-secondary-container); border-bottom-right-radius: 6px; }
    .msg.user .body { white-space: pre-wrap; }
    .msg.assistant { align-self: flex-start; background: var(--layer1); border-bottom-left-radius: 6px; }
    .msg.error { background: color-mix(in srgb, var(--error) 16%, var(--layer1)); }
    .msg .who { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--primary); margin-bottom: 4px; }
    .msg .who .ms { font-size: 14px; }
    .msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
    .msg h3, .msg h4, .msg h5 { margin: 8px 0 4px; font-weight: 600; }
    .msg ul, .msg ol { margin: 4px 0 8px; padding-left: 20px; }
    .msg code { font-family: var(--mono); font-size: 12px; background: var(--layer3); padding: 1px 5px; border-radius: 5px; }
    .msg blockquote { margin: 4px 0; padding-left: 10px; border-left: 3px solid var(--outline-variant); color: var(--on-surface-variant); }
    .msg a { color: var(--primary); text-decoration: underline; cursor: pointer; }
    .code { background: var(--surface-container-lowest); border-radius: var(--round-md); margin: 6px 0; overflow: hidden; }
    .code-head { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 4px 12px; font-size: 11px; color: var(--on-surface-variant); background: var(--layer2); }
    .code-head .copy { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; } .code-head .copy:hover { background: var(--hover); }
    .code-head .ms { font-size: 15px; }
    .code pre { margin: 0; padding: 10px 12px; overflow-x: auto; } .code pre code { background: none; padding: 0; }
    .ai-note { align-self: center; font-size: 11.5px; color: var(--on-surface-variant); background: var(--layer1); border-radius: var(--round-full); padding: 5px 12px; white-space: pre-wrap; text-align: center; }
    .dots i { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--primary); animation: blink 1s infinite; }
    .dots i:nth-child(2) { animation-delay: 0.15s; } .dots i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .ai-input { display: flex; gap: 6px; align-items: flex-end; background: var(--layer2); border-radius: var(--round-xl); padding: 6px 6px 6px 16px; }
    .ai-input textarea { flex: 1; border: 0; outline: none; background: none; resize: none; padding: 9px 0; max-height: 160px; font-size: 13.5px; }
    .busy .ai-input .icon-btn.filled { background: var(--error); color: var(--on-error); }

    /* translator */
    .tr-langs { display: flex; gap: 6px; align-items: center; }
    .tr-langs .field { flex: 1; height: 42px; padding: 0 14px; }
    .tr-box { flex: 1; min-height: 120px; font-size: 15px; line-height: 1.5; }
    .tr-out-wrap { flex: 1; min-height: 120px; display: flex; flex-direction: column; background: var(--layer1); border-radius: var(--round-md); }
    .tr-out { flex: 1; padding: 12px 14px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; user-select: text; }
    .tr-out.loading { opacity: 0.5; }
    .tr-actions { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 6px 14px; font-size: 12px; }

    /* anime */
    .an-search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 8px 0 14px; border-radius: var(--round-full); background: var(--layer2); }
    .an-search input { flex: 1; border: 0; outline: none; background: none; }
    .an-search .ms { color: var(--on-surface-variant); }
    .an-search .nsfw { height: 24px; padding: 0 8px; background: var(--error); color: var(--on-error); font-size: 11px; }
    .an-grid { flex: 1; min-height: 0; }
    .an-cols { columns: 2; column-gap: 8px; }
    .an-item { position: relative; break-inside: avoid; margin-bottom: 8px; border-radius: var(--round-md); overflow: hidden; background: var(--layer2); }
    .an-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .an-actions { position: absolute; inset: auto 6px 6px 6px; display: flex; gap: 4px; justify-content: flex-end; opacity: 0; transition: opacity 0.2s; }
    .an-item:hover .an-actions { opacity: 1; }
    .an-actions button { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--layer0) 85%, transparent); }
    .an-actions button:hover { background: var(--primary); color: var(--on-primary); }
    .an-actions .ms { font-size: 18px; }
    .an-more { display: flex; margin: 6px auto 12px; }
    .spinner.small { width: 16px; height: 16px; border-width: 2px; margin: 0; display: inline-block; }

    /* football */
    .fb-top { display: flex; flex-direction: column; gap: 6px; }
    .scroll-x { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .scroll-x .chip { flex: none; }
    .fb-views { display: flex; gap: 6px; align-items: center; }
    .fb-views .chip .ms { font-size: 17px; }
    .fb-views .icon-btn { margin-left: auto; }
    .fb-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
    .fb-day { font-size: 12px; color: var(--primary); padding: 8px 4px 2px; font-weight: 500; }
    .fb-match { background: var(--layer1); border-radius: var(--round-md); padding: 10px 12px; cursor: pointer; }
    .fb-match:hover { background: color-mix(in srgb, var(--layer1), var(--on-surface) 5%); }
    .fb-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
    .fb-team { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; }
    .fb-team.away { flex-direction: row-reverse; text-align: right; }
    .fb-team img { width: 24px; height: 24px; object-fit: contain; flex: none; }
    .fb-score { text-align: center; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; min-width: 70px; }
    .fb-score small { font-size: 10.5px; font-weight: 400; color: var(--on-surface-variant); }
    .fb-score.pre { font-size: 14px; font-weight: 500; }
    .fb-score.live { color: var(--primary); }
    .fb-prob { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; }
    .fb-prob i:nth-child(1) { background: var(--primary); } .fb-prob i:nth-child(2) { background: var(--outline-variant); } .fb-prob i:nth-child(3) { background: var(--tertiary); }
    .fb-prob-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--on-surface-variant); margin-top: 3px; }
    .fb-more { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; font-size: 11.5px; text-align: center; }
    .fb-more div { background: var(--layer2); border-radius: var(--round-sm); padding: 8px 4px; display: flex; flex-direction: column; gap: 2px; }
    .fb-more b { font-size: 14px; font-weight: 500; } .fb-more span { color: var(--on-surface-variant); }
    .fb-table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
    .fb-table th { font-weight: 400; color: var(--on-surface-variant); font-size: 11px; padding: 4px; text-align: center; }
    .fb-table td { padding: 6px 4px; text-align: center; border-top: 1px solid color-mix(in srgb, var(--outline-variant) 40%, transparent); }
    .fb-table td.t { text-align: left; display: flex; align-items: center; gap: 6px; max-width: 190px; }
    .fb-table img { width: 18px; height: 18px; object-fit: contain; }

    /* player */
    #player { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; background: var(--layer1); border-radius: var(--round-lg); padding: 14px; }
    .art {
      position: relative; width: 100%; aspect-ratio: 1; max-height: 42vh; align-self: center;
      border-radius: var(--round-lg); overflow: hidden;
      background: linear-gradient(135deg, var(--primary-container), var(--tertiary-container));
      display: grid; place-items: center;
    }
    .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .art .ms { font-size: 72px; color: var(--on-primary-container); opacity: 0.6; }
    .meta { text-align: center; line-height: 1.3; }
    .meta .t { font-size: 19px; font-weight: 500; }
    .meta .a { font-size: 14px; color: var(--on-surface-variant); }

    #lyrics { flex: 1; min-height: 60px; overflow: hidden; position: relative; text-align: center;
      -webkit-mask-image: linear-gradient(transparent, #000 25%, #000 75%, transparent); }
    #lyrics .inner { position: absolute; left: 0; right: 0; transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1); will-change: transform; }
    #lyrics .l { padding: 3px 8px; font-size: 14px; color: var(--on-surface-variant); opacity: 0.55; transition: opacity 0.4s ease, transform 0.4s ease, color 0.4s ease; }
    #lyrics .l.cur { color: var(--on-surface); opacity: 1; transform: scale(1.15); font-weight: 500; }   /* scale, not font-size: no layout shift mid-scroll */
    #lyrics .none { position: absolute; inset: 0; display: grid; place-items: center; color: var(--on-surface-variant); font-size: 13px; }

    .progress { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; }
    .bar { flex: 1; height: 8px; cursor: pointer; border-radius: 3px; background: var(--secondary-container); overflow: hidden; }
    .bar > div { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.9s linear; }
    .controls { display: flex; gap: 8px; align-items: center; justify-content: center; }
    .controls button { height: 56px; flex: 1; border-radius: var(--round-lg); background: var(--layer3); display: grid; place-items: center; transition: border-radius 0.3s var(--ease), background 0.2s; }
    .controls button:hover { background: var(--layer4); }
    .controls button:active { border-radius: var(--round-sm); }
    .controls button.main { flex: 1.6; background: var(--primary); color: var(--on-primary); border-radius: var(--round-xl); }
    .controls button:disabled { opacity: 0.4; }
    .controls .ms { font-size: 26px; }
    .sessions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .sessions .chip { cursor: pointer; font-size: 12px; height: 28px; }
    .sessions .chip.sel { background: var(--secondary-container); color: var(--on-secondary-container); }
    .nothing { margin: auto; text-align: center; color: var(--on-surface-variant); }
    .nothing .ms { font-size: 56px; display: block; margin-bottom: 8px; }

    /* resources */
    #res { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .stat { background: var(--layer1); border-radius: var(--round-md); padding: 10px 6px; text-align: center; }
    .stat .ring-wrap { position: relative; width: 44px; height: 44px; margin: 0 auto 4px; }
    .stat .ring-wrap .ms { position: absolute; inset: 0; display: grid; place-items: center; font-size: 20px; color: var(--primary); }
    .stat b { display: block; font-weight: 500; font-size: 15px; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 11px; color: var(--on-surface-variant); }
  </style>
</head>
<body>
  <div id="panel">
    <div class="top">
      <div class="tabbar" id="tabs">
        <button data-tab="home" title="Home"><span class="ms">home</span><span class="lbl">Home</span></button>
        <button data-tab="ai" title="AI"><span class="ms">neurology</span><span class="lbl">AI</span></button>
        <button data-tab="translate" title="Translator"><span class="ms">translate</span><span class="lbl">Translate</span></button>
        <button data-tab="anime" title="Anime"><span class="ms">photo_library</span><span class="lbl">Anime</span></button>
        <button data-tab="football" title="Football"><span class="ms">sports_soccer</span><span class="lbl">Football</span></button>
      </div>
      <button class="icon-btn" id="pin" title="Keep open"><span class="ms">keep</span></button>
    </div>
    <div class="tab-page" id="tab-home">
      <div id="player"></div>
      <div id="res"></div>
    </div>
    <div class="tab-page" id="tab-ai"></div>
    <div class="tab-page" id="tab-translate"></div>
    <div class="tab-page" id="tab-anime"></div>
    <div class="tab-page" id="tab-football"></div>
  </div>
  <script type="module" src="./sidebar-left.js"></script>
</body>
</html>
