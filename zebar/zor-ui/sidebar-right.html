<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>zor-ui sidebar right</title>
  <link rel="stylesheet" href="./lib/base.css" />
  <style>
    /* The window is placed 56px below the top and is as tall as the screen,
       so the panel uses 100vh - 56px to stop at the bottom edge. */
    #panel {
      position: absolute;
      top: 0; right: 6px;
      width: calc(100% - 12px);
      height: calc(100vh - 56px - 6px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      background: var(--layer0);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 45%, transparent);
      border-radius: var(--round-xl);
      box-shadow: var(--shadow);
      animation: slide-in-right 0.35s var(--ease);
    }
    header { display: flex; align-items: center; gap: 10px; padding: 2px 2px 0 6px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-container); color: var(--on-primary-container); font-size: 18px; font-weight: 600; }
    .who { flex: 1; min-width: 0; line-height: 1.25; }
    .who b { display: block; font-weight: 500; font-size: 15px; }
    .who span { font-size: 12px; }

    /* power menu */
    #power { display: none; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    #power.open { display: grid; animation: pop-in 0.25s var(--ease); }
    #power button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; border-radius: var(--round-md); background: var(--layer2); font-size: 11.5px; }
    #power button:hover { background: var(--layer3); }
    #power button.danger { background: var(--error); color: var(--on-error); }

    /* android-style quick toggles */
    #toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .tg {
      display: flex; align-items: center; gap: 10px;
      height: 58px; padding: 0 12px 0 10px;
      border-radius: var(--round-xl);
      background: var(--layer2);
      text-align: left;
      transition: background 0.25s var(--ease-fx), border-radius 0.35s var(--ease);
    }
    .tg:hover { background: var(--layer3); }
    .tg:active { border-radius: var(--round-md); }
    .tg .bubble { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--layer4); flex: none; }
    .tg .txt { min-width: 0; line-height: 1.2; }
    .tg .txt b { display: block; font-weight: 500; font-size: 13.5px; }
    .tg .txt span { font-size: 11.5px; color: var(--on-surface-variant); }
    .tg.on { background: var(--primary); color: var(--on-primary); border-radius: var(--round-lg); }
    .tg.on .bubble { background: color-mix(in srgb, var(--on-primary) 16%, transparent); }
    .tg.on .txt span { color: color-mix(in srgb, var(--on-primary) 75%, transparent); }
    .tg.busy { opacity: 0.6; }
    .tg.na { opacity: 0.45; pointer-events: none; }

    #sliders { display: flex; flex-direction: column; gap: 6px; }

    /* per-app volume (end4's volume mixer) */
    #mixer-btn { align-self: flex-start; }
    #mixer-btn.sel { background: var(--secondary-container); color: var(--on-secondary-container); }
    #mixer { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
    #mixer[hidden] { display: none; }
    .mix { display: flex; align-items: center; gap: 6px; }
    .mix .slider { flex: 1; }
    .mix .name { position: relative; z-index: 1; margin-left: 16px; font-size: 13px; color: var(--on-primary); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mix.muted .slider { opacity: 0.55; }

    /* bottom group: calendar / to-do tabs */
    #bottom { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--layer1); border-radius: var(--round-lg); overflow: hidden; }
    .tabs { display: flex; gap: 4px; padding: 8px 8px 0; }
    .tabs button { flex: 1 1 auto; white-space: nowrap; padding: 0 10px; height: 36px; border-radius: var(--round-full); font-size: 13px; color: var(--on-surface-variant); display: flex; align-items: center; justify-content: center; gap: 6px; }
    .tabs button.sel { background: var(--secondary-container); color: var(--on-secondary-container); }
    .tabs .ms { font-size: 18px; }
    .page { flex: 1; min-height: 0; padding: 12px; display: none; }
    .page.sel { display: flex; flex-direction: column; }

    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .cal-head .chip { background: var(--secondary-container); color: var(--on-secondary-container); font-weight: 500; }
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 13px; }
    .cal .dow { color: var(--on-surface-variant); font-size: 11.5px; padding: 6px 0; }
    .cal .d { height: 34px; display: grid; place-items: center; border-radius: 50%; margin: 0 auto; width: 34px; }
    .cal .d.out { color: var(--outline); opacity: 0.6; }
    .cal .d.today { background: var(--primary); color: var(--on-primary); font-weight: 600; }

    #todo-list { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .todo { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 8px 0 12px; border-radius: var(--round-md); background: var(--layer2); }
    .todo.done .t { text-decoration: line-through; color: var(--on-surface-variant); }
    .todo .t { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 13.5px; }
    .todo .chk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--outline); display: grid; place-items: center; flex: none; }
    .todo.done .chk { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
    .todo .chk .ms { font-size: 15px; }
    .todo-add { display: flex; gap: 6px; margin-top: 8px; }
    .todo-add input { flex: 1; height: 40px; padding: 0 14px; border-radius: var(--round-full); border: 1px solid var(--outline-variant); background: var(--layer2); outline: none; }
    .todo-add input:focus { border-color: var(--primary); }
    .empty { margin: auto; text-align: center; color: var(--on-surface-variant); }
    .tabs .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--primary); color: var(--on-primary); font-size: 11px; display: inline-grid; place-items: center; }
    .tabs .badge:empty { display: none; }
    #notif-list { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .ngroup { background: var(--layer2); border-radius: var(--round-md); padding: 8px 10px; }
    .ngroup-head { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--on-surface-variant); margin-bottom: 4px; }
    .ngroup-head .app { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--secondary-container); color: var(--on-secondary-container); font-size: 11px; font-weight: 600; }
    .ngroup-head .sp { flex: 1; }
    .ngroup-head button { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; }
    .ngroup-head button:hover { background: var(--hover); }
    .ngroup-head button .ms { font-size: 16px; }
    .notif { display: flex; gap: 8px; padding: 6px 2px; border-top: 1px solid color-mix(in srgb, var(--outline-variant) 35%, transparent); }
    .notif:first-of-type { border-top: 0; }
    .notif .tx { flex: 1; min-width: 0; font-size: 13px; line-height: 1.35; }
    .notif .tx b { font-weight: 500; display: block; }
    .notif .tx span { color: var(--on-surface-variant); white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .notif time { font-size: 11px; color: var(--on-surface-variant); flex: none; }
    .notif-foot { display: flex; justify-content: space-between; margin-top: 8px; }
    .notif-foot .chip { cursor: pointer; } .notif-foot .chip .ms { font-size: 16px; }
    .empty .ms { font-size: 44px; display: block; margin-bottom: 6px; }

    /* pomodoro + stopwatch (end4's PomodoroWidget) */
    #page-timer { align-items: center; gap: 12px; }
    .chips.mode { justify-content: center; }
    .dial-wrap { position: relative; display: grid; place-items: center; margin-top: 4px; }
    .dial-wrap .ring-track { stroke: var(--layer3); }
    .dial-wrap .mid { position: absolute; text-align: center; }
    .dial-wrap .mid b { display: block; font-size: 40px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .dial-wrap .mid span { font-size: 13px; color: var(--on-surface-variant); }
    .t-ctl { display: flex; gap: 8px; align-items: center; }
    .t-ctl .icon-btn.filled { width: 56px; height: 56px; border-radius: var(--round-lg); }
    .t-ctl .icon-btn.filled .ms { font-size: 28px; }
    .sw-big { font-size: 44px; font-weight: 500; font-variant-numeric: tabular-nums; margin: 28px 0 8px; }
    .laps { width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; }
    .laps div { display: flex; justify-content: space-between; padding: 6px 12px; border-radius: var(--round-sm); background: var(--layer2); font-size: 13px; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="panel">
    <header>
      <div class="avatar" id="avatar"></div>
      <div class="who"><b id="user"></b><span class="muted" id="uptime"></span></div>
      <button class="icon-btn" data-cmd="settings" title="Settings (right-click: Windows Settings)"><span class="ms">settings</span></button>
      <button class="icon-btn" data-cmd="reload" title="Reload GlazeWM config"><span class="ms">restart_alt</span></button>
      <button class="icon-btn" data-cmd="power" title="Power"><span class="ms">power_settings_new</span></button>
    </header>
    <div id="power">
      <button data-p="lock"><span class="ms">lock</span>Lock</button>
      <button data-p="sleep"><span class="ms">bedtime</span>Sleep</button>
      <button data-p="logout"><span class="ms">logout</span>Sign out</button>
      <button data-p="restart"><span class="ms">restart_alt</span>Restart</button>
      <button data-p="shutdown" class="danger"><span class="ms">power_settings_new</span>Shut down</button>
    </div>
    <div id="toggles"></div>
    <div id="sliders"></div>
    <button class="chip" id="mixer-btn"><span class="ms">tune</span>App volume</button>
    <div id="mixer" class="scroll" hidden></div>
    <div id="bottom">
      <div class="tabs">
        <button data-tab="notif" class="sel"><span class="ms">notifications</span>Notifications<span class="badge" id="notif-count"></span></button>
        <button data-tab="cal"><span class="ms">calendar_month</span>Calendar</button>
        <button data-tab="todo"><span class="ms">done_outline</span>To Do</button>
        <button data-tab="timer"><span class="ms">timer</span>Timer</button>
      </div>
      <div class="page sel" id="page-notif">
        <div id="notif-list" class="scroll"></div>
        <div class="notif-foot">
          <button class="chip" id="notif-center"><span class="ms">open_in_new</span>Notification center</button>
          <button class="chip" id="notif-clear"><span class="ms">clear_all</span>Clear</button>
        </div>
      </div>
      <div class="page" id="page-cal"></div>
      <div class="page" id="page-timer"></div>
      <div class="page" id="page-todo">
        <div id="todo-list" class="scroll"></div>
        <form class="todo-add" id="todo-form"><input id="todo-input" placeholder="Add a task" autocomplete="off" /><button class="icon-btn filled" type="submit"><span class="ms">add</span></button></form>
      </div>
    </div>
  </div>
  <script type="module" src="./sidebar-right.js"></script>
</body>
</html>
